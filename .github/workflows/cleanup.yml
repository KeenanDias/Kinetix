# Daily data-retention job: deletes old payment screenshots and old registrations
# (see /privacy). Calls the live site's /api/cron/cleanup endpoint.
#
# Setup (GitHub repo -> Settings -> Secrets and variables -> Actions):
#   Secret   CRON_SECRET  same value as CRON_SECRET in the site's environment variables
#   Variable SITE_URL     e.g. https://kinetixvolleyball.ca  (no trailing slash)
name: Data cleanup

on:
  schedule:
    - cron: "17 9 * * *" # daily, ~4-5am Toronto time
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run cleanup
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL variable or CRON_SECRET secret not set yet - skipping."
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$SITE_URL/api/cron/cleanup" \
            -H "Authorization: Bearer $CRON_SECRET"
